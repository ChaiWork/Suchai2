<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon TCG Battle Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #313244;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        h1 {
            color: #cba6f7;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #a6adc8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .file-upload-btn {
            display: inline-block;
            background: linear-gradient(135deg, #89b4fa, #b4befe);
            color: #11111b;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .file-upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(137, 180, 250, 0.4);
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pokémon TCG Visualizer</h1>
        <p>Select a battle replay JSON file (e.g., <code>vis.json</code>) to launch the official interactive battle player in your browser.</p>
        <label for="fileInput" class="file-upload-btn">Choose vis.json File</label>
        <input type="file" id="fileInput" accept=".json">
    </div>
    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const obj = JSON.parse(e.target.result);

                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = "json";
                    if ("steps" in obj) {
                        input.value = JSON.stringify(obj["steps"][0][0]["visualize"]);
                    } else {
                        input.value = e.target.result;
                    }

                    const form = document.createElement("form");
                    form.method = "POST";
                    form.action = "https://ptcgvis.heroz.jp/Visualizer/Replay/0";
                    form.target = "_blank";
                    form.appendChild(input);

                    document.body.appendChild(form);
                    form.submit();
                };
                reader.readAsText(file);
            }
        });
    </script>
</body>
</html>
